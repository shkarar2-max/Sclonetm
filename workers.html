<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рабочие</title>
    <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px;
    }

    #container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: flex-start; 
    }

    .link-item {
      color: #1a0dab;
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
      display: inline-block;
    }

    .link-item:hover {
      text-decoration: underline;
      color: #0b51c5;
    }

    #sentinel {
      height: 20px;
      width: 100%;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 100;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      position: relative;
      background: white;
      padding: 28px 24px 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 360px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }

    .close-cross {
      position: absolute;
      top: 10px; right: 14px;
      font-size: 24px; font-weight: bold;
      color: #888; cursor: pointer;
      line-height: 1; background: none; border: none;
    }

    .close-cross:hover { color: #000; }

    .modal-header-fixed {
      margin: 0 0 12px 0;
      font-size: 20px;
      font-weight: 700;
      color: #111;
    }

    .modal-desc {
      font-size: 15px;
      line-height: 1.5;
      color: #333;
      margin: 0;
    }

    /* Оверлей блокировки ключом PASSKEY */
    .auth-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .auth-box {
      background: #111;
      color: #fff;
      border: 2px solid #333;
      text-align: center;
      max-width: 320px;
      width: 85%;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }

    .auth-box h2 {
      margin-top: 0;
      font-size: 20px;
      color: white;
    }

    .auth-box p {
      font-size: 14px;
      line-height: 1.4;
      color: #ccc;
    }

    .file-upload-btn {
      display: inline-block;
      margin-top: 15px;
      background: #222;
      color: green;
      border: 1px solid green;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .file-upload-btn:hover {
      background: #00ff66;
      color: #000;
    }

    #passkey-input {
      display: none;
    }

    .auth-error {
      color: #ff4d4d;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Окно авторизации -->
  <div class="auth-overlay" id="auth-overlay">
    <div class="auth-box">
      <h2>ТРЕБУЕТСЯ КЛЮЧ ДОСТУПА</h2>
      <p>Для просмотра загрузите ключ</p>
      
      <label for="passkey-input" class="file-upload-btn">Загрузить PASSKEY</label>
      <input type="file" id="passkey-input">
      
      <div class="auth-error" id="auth-error">Access Denied.</div>
    </div>
  </div>

  <nav class="navbar">
      <a href="index.html">Главная</a>
      <a href="about.html">О нас</a>
      <a href="apply.html">Вакансии</a>
      <a href="workers.html">Рабочие</a>
      <a href="files.html">Статьи</a>
  </nav>

  <div id="container"></div>
  <div id="sentinel"></div>

  <!-- Модалка -->
  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <button class="close-cross" id="modal-close">&times;</button>
      <h3 class="modal-header-fixed" id="modal-title">Запись № 0</h3>
      <p class="modal-desc" id="modal-desc">Текст...</p>
    </div>
  </div>

  <script>
    // === ВОТ ЗДЕСЬ ТЕПЕРЬ ПРАВИЛЬНАЯ ПРОВЕРКА ПО БАЙТАМ ===
    const authOverlay = document.getElementById('auth-overlay');
    const passkeyInput = document.getElementById('passkey-input');
    const authError = document.getElementById('auth-error');

    // Твой точный вес в байтах
    const SECRET_SIZE = 876;

    // Если ключ уже принят
    if (localStorage.getItem('sclone_passkey_granted') === 'true') {
      authOverlay.style.display = 'none';
    }

    passkeyInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      // ПРОВЕРКА: Весит ли файл ровно 876 байт?
      if (file.size === SECRET_SIZE) {
        // Успех
        localStorage.setItem('sclone_passkey_granted', 'true');
        authOverlay.style.display = 'none';
        authError.style.display = 'none';
      } else {
        // Ошибка
        authError.style.display = 'block';
        passkeyInput.value = ''; // Сброс неверного файла
      }
    });

    // === КОД БЕСКОНЕЧНОГО СПИСКА (без изменений) ===
    const container = document.getElementById('container');
    const sentinel = document.getElementById('sentinel');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const modalClose = document.getElementById('modal-close');

    let counter = 2;
    const batchSize = 20;
    const customItems = {};

    function loadMoreItems() {
      const fragment = document.createDocumentFragment();
      for (let i = 0; i < batchSize; i++) {
        const item = document.createElement('span');
        item.classList.add('link-item');
        item.dataset.id = counter;
        item.textContent = `Сус ${counter}`;
        fragment.appendChild(item);
        counter++;
      }
      container.appendChild(fragment);
    }
    loadMoreItems();

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) loadMoreItems();
      });
    }, { rootMargin: '200px' });
    observer.observe(sentinel);

    container.addEventListener('click', (e) => {
      const link = e.target.closest('.link-item');
      if (!link) return;
      const id = link.dataset.id;
      modalTitle.textContent = `Сус ${id}`;
      if (customItems[id]) {
        modalDesc.textContent = customItems[id];
      } else {
        modalDesc.textContent = `Информации о Сусе ${id} не найдено, подождите загрузки серверов.`;
      }
      modal.classList.add('active');
    });

    modalClose.addEventListener('click', () => modal.classList.remove('active'));
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('active');
    });
  </script>
</body>
</html>
