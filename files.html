<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статьи — SCLONE™</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .auth-box {
            background: #111;
            color: #fff;
            border: 2px solid #333;
            padding: 20px;
            text-align: center;
            max-width: 300px;
            width: 80%;
        }

        .file-upload-btn {
            display: inline-block;
            margin-top: 15px;
            color: #00ff66;
            cursor: pointer;
            text-decoration: underline;
        }

        #passkey-input {
            display: none;
        }

        .auth-error {
            color: #ff4d4d;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Окно авторизации -->
    <div class="auth-overlay" id="auth-overlay">
        <div class="auth-box">
            <h2>ТРЕБУЕТСЯ КЛЮЧ ДОСТУПА</h2>
            <p>Для просмотра загрузите ключ</p>
            <label for="passkey-input" class="file-upload-btn">Загрузить PASSKEY</label>
            <input type="file" id="passkey-input">
            <div class="auth-error" id="auth-error">Access Denied.</div>
        </div>
    </div>
    <!-- Список статей -->
    <nav>
        <a href="almz.html">Алмаз нестабильности</a>
    </nav>

    <!-- Навбар -->
    <nav class="navbar">
        <a href="index.html">Главная</a>
        <a href="about.html">О нас</a>
        <a href="apply.html">Вакансии</a>
        <a href="workers.html">Рабочие</a>
        <a href="files.html">Статьи</a>
    </nav>

    <script>
        const authOverlay = document.getElementById('auth-overlay');
        const passkeyInput = document.getElementById('passkey-input');
        const authError = document.getElementById('auth-error');
        const SECRET_SIZE = 876;

        if (localStorage.getItem('sclone_passkey_granted') === 'true') {
            authOverlay.style.display = 'none';
        }

        passkeyInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (file.size === SECRET_SIZE) {
                localStorage.setItem('sclone_passkey_granted', 'true');
                authOverlay.style.display = 'none';
                authError.style.display = 'none';
            } else {
                authError.style.display = 'block';
                passkeyInput.value = '';
            }
        });
    </script>
</body>
</html>
